<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout · Pixel Arcade</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="game-page">
    <header class="topbar">
      <a class="back" href="../index.html">← Arcade</a>
      <h1 class="pixel-title">Breakout</h1>
      <span class="best" id="best">BEST —</span>
    </header>
    <main class="stage">
      <canvas id="game" class="game-canvas" width="480" height="600" tabindex="0" aria-label="Breakout"></canvas>
      <p class="hint"><kbd>←</kbd> <kbd>→</kbd> or move the mouse · <kbd>Space</kbd> / tap to launch · <kbd>R</kbd> restart</p>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../src/ui/breakout-ui.js"></script>
  </body>
</html>

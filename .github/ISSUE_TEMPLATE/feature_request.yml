name: Feature request
description: Suggest a new game, control, or improvement
title: "Short description"
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - A specific game
        - All games
        - Hub / scores
        - New game
        - Tooling / docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
